<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فواتير لوفينا</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a07e62'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3EL%3C/text%3E%3C/svg%3E">
<style>
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet"><style>
:root{
  --bg:#f8f5f1; --card:#ffffff; --ink:#2a2420; --muted:#8b8079; --line:#ebe4dc;
  --accent:#a07e62; --accent-d:#7f6149; --soft:#f3ece4; --ok:#4f7a5a; --ok-soft:#e9f2ea;
  --warn:#b5623f; --warn-soft:#fbeee7; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Amiri',serif}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:26px;letter-spacing:4px;color:var(--accent-d);line-height:1}
.brand small{display:block;font-family:'IBM Plex Sans Arabic';font-size:11px;letter-spacing:0;color:var(--muted);font-weight:400;margin-top:4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--soft);color:var(--accent-d);font-weight:700}
nav button:hover{color:var(--ink)}
.spacer{flex:1}
.pill{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--muted);cursor:pointer;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
h1{font-family:'Amiri',serif;font-weight:700;font-size:34px;margin:0 0 4px}
h2{font-family:'Amiri',serif;font-weight:700;font-size:22px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat .k{color:var(--muted);font-size:13px}
.stat .v{font-size:26px;font-weight:700;margin-top:2px}
.stat .v small{font-size:14px;font-weight:400;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;padding:9px 18px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.p:hover{background:var(--accent-d)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--warn)}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent-d);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;color:var(--muted);font-weight:400;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fcfaf7}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent-d)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.right{margin-inline-start:auto}
.items td input,.items td select{padding:7px 9px}
.totals{max-width:360px;margin-inline-start:auto}
.totals .l{display:flex;justify-content:space-between;padding:6px 0}
.totals .l.big{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px}
.list-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(40,30,25,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;z-index:60;font-size:14px}
.ln-title{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.ln-title h3{margin:0;font-size:17px}
.bal{font-weight:700}
.credit{color:var(--ok)}
#print{display:none}
@media print{
  body{background:#fff}
  header.top,main,.modal-bg,.toast{display:none!important}
  #print{display:block}
  @page{size:A4;margin:14mm}
}
/* ---- print document ---- */
.doc{font-family:'IBM Plex Sans Arabic',sans-serif;color:#222;font-size:13px}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #a07e62;padding-bottom:12px;margin-bottom:16px}
.doc .db{font-family:'Amiri',serif;font-size:34px;font-weight:700;letter-spacing:6px;color:#7f6149;line-height:1}
.doc .db small{display:block;font-family:'IBM Plex Sans Arabic';font-size:11px;letter-spacing:1px;color:#8b8079;font-weight:400;margin-top:6px}
.doc .dinfo{text-align:left;font-size:12px;color:#555;line-height:1.7}
.doc .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px;line-height:1.8}
.doc table{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc th{background:#f6f1eb;font-weight:700;text-align:right;padding:7px 8px;font-size:12px}
.doc td{padding:7px 8px;border-bottom:1px solid #eee}
.doc .tot{width:280px;margin-inline-start:auto}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 0}
.doc .tot .g{font-weight:700;font-size:16px;border-top:1px solid #ccc;padding-top:8px;margin-top:4px}
.doc h4{font-size:14px;margin:18px 0 6px;color:#7f6149}
.doc .foot{margin-top:28px;text-align:center;color:#999;font-size:11px}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">LUVINA<small>برنامج الفواتير</small></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span class="pill" id="syncPill" title="المزامنة">—</span>
</div></header>
<main id="view"></main>
<div id="print"></div>
<script>
const SEED = {"invoices": {}, "customers": {}, "settings": {}};
/* ================= storage ================= */
const LS_DATA='luvina_inv_db_web_v1', LS_DEV='luvina_inv_device', LS_SYNC='luvina_inv_sync';
const COLLS=['invoices','customers','settings'];
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('مشكلة في الحفظ على الجهاز!');return false}}
let DB=lsGet(LS_DATA);
if(!DB||!DB.invoices){DB=clone(SEED);lsSet(LS_DATA,DB)}
COLLS.forEach(c=>{DB[c]=DB[c]||{}});
let DEV=lsGet(LS_DEV);
function persist(){lsSet(LS_DATA,DB);scheduleSync()}
function put(coll,obj){obj.u=Date.now();DB[coll][obj.id]=obj;persist()}

const DEF={company:'LUVINA',phone:'01270455444',address:'4 ش ابن عبد الظاهر - أمام مستشفى منشية البكري - هليوبوليس - مصر الجديدة',
  site:'luvinatex.com',price160:2750,price3m:5500,stretchPrice:4000,rollLen:25,
  tiers:[{min:10,pct:10},{min:20,pct:15},{min:50,pct:20},{min:100,pct:25},{min:200,pct:30}],
  stretchTiers:[{min:10,pct:10},{min:20,pct:15},{min:50,pct:20}],
  colors:'',reps:['ملك','منى','دعاء','محمود']};
function S(){const m=DB.settings.main||{};return Object.assign({},DEF,m,{reps:(m.reps&&m.reps.length)?m.reps:DEF.reps,site:m.site||DEF.site})}
function saveSettings(patch){const m=Object.assign({id:'main'},DB.settings.main||{},patch);put('settings',m)}

/* ================= helpers ================= */
const METHODS=['كاش','إنستاباي','محفظة إلكترونية'];
const LINES={tulle:'التل',stretch:'التل الاسترتش',lace:'الفرنش ليس',other:'منتجات تانية'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){v=Number(v);return isFinite(v)?v:0}
function money(v){return Math.round(n(v)).toLocaleString('en-US')+' ج'}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function month(){return today().slice(0,7)}
function arDate(s){if(!s)return'';const[y,m,d]=s.split('-');return `${+d}/${+m}/${y}`}
function colorMap(){const m={};(S().colors||'').split('\n').forEach(l=>{const[k,...r]=l.split('=');if(k&&r.length)m[k.trim()]=r.join('=').trim()});return m}
function tierPct(tiers,q){let p=0;(tiers||[]).forEach(t=>{if(q>=n(t.min))p=Math.max(p,n(t.pct))});return p}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function active(){return Object.values(DB.invoices).filter(i=>!i.deleted)}
function paidOf(i){return (i.payments||[]).reduce((a,p)=>a+n(p.amount),0)}
function remOf(i){return n(i.total)-paidOf(i)}
function itemWidth(it){return it.width||((it.name||'').includes('3 متر')?'3m':'160')}
function itemColor(it){if(it.color!=null)return it.color;const m=(it.name||'').match(/لون\s*(\d+)/);return m?m[1]:''}
function tulleName(w,c){const nm=colorMap()[c];return `تل كورساج عرض ${w==='3m'?'3 متر':'160 سم'}`+(c?` — لون ${c}${nm?` (${nm})`:''}`:'')}
function lineOf(i){if(i.line)return i.line;const k=new Set((i.items||[]).map(x=>x.kind));if(k.size===1){const v=[...k][0];if(LINES[v])return v}if(k.has('tulle'))return'tulle';return'other'}
function custOfInv(i){
  if(i.custId&&DB.customers[i.custId])return DB.customers[i.custId];
  const cs=Object.values(DB.customers).filter(c=>!c.deleted);
  return (i.phone&&cs.find(c=>c.phone&&c.phone===i.phone))||cs.find(c=>c.name===i.customer)||null}
function invsOf(c){return active().filter(i=>{const x=custOfInv(i);return x&&x.id===c.id}).sort(byDate)}
function byDate(a,b){return (a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||'')}
function nextNo(){const L=(DEV&&DEV.letter)||'A';let mx=0;Object.values(DB.invoices).forEach(i=>{const m=(i.no||'').match(new RegExp('^LV-'+L+'-(\\d+)$'));if(m)mx=Math.max(mx,+m[1])});return `LV-${L}-${String(mx+1).padStart(4,'0')}`}

/* discount math: only tulle + stretch are discountable */
function calc(inv,cust){
  const s=S();let tq=0,ts=0,sq=0,ss=0,os=0;
  (inv.items||[]).forEach(it=>{it.total=Math.round(n(it.qty)*n(it.price));
    if(it.kind==='tulle'){tq+=n(it.qty);ts+=it.total}else if(it.kind==='stretch'){sq+=n(it.qty);ss+=it.total}else os+=it.total});
  const sub=(inv.opening&&!(inv.items||[]).length)?n(inv.sub):ts+ss+os;
  let d=0,label='';const t=inv.discType||'auto';
  if(t==='auto'){
    const c=n(cust&&cust.type==='trader'?cust.contractDisc:0);
    const pt=Math.max(c,tierPct(s.tiers,tq)),ps=Math.max(c,tierPct(s.stretchTiers,sq));
    d=ts*pt/100+ss*ps/100;
    const ls=[];if(ts&&pt)ls.push(pt+'%');if(ss&&ps&&ps!==pt)ls.push(ps+'% استرتش');label=ls.join(' + ');
  }else if(t==='pct'){d=(ts+ss)*n(inv.discValue)/100;label=n(inv.discValue)+'%'}
  else if(t==='amt'){d=n(inv.discValue)}
  d=Math.round(d);
  inv.sub=sub;inv.discount=d;inv.discLabel=label;inv.total=sub-d;inv.paid=paidOf(inv);
  return inv}

/* ================= router / nav ================= */
let VIEW='home',ARG=null;
const NAV=[['home','الرئيسية'],['new','فاتورة جديدة'],['list','الفواتير'],['customers','العملاء'],['more','المزيد']];
function go(v,a){if(v==='new'&&a!=='keep'){F=null;a='keep'}VIEW=v;ARG=a??null;render();window.scrollTo(0,0)}
function render(){
  document.getElementById('nav').innerHTML=NAV.map(([k,t])=>`<button class="${(VIEW===k||(k==='list'&&VIEW==='inv')||(k==='customers'&&VIEW==='cust'))?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  const el=document.getElementById('view');
  ({home:vHome,new:vNew,list:vList,inv:vInv,customers:vCustomers,cust:vCust,more:vMore,trash:vTrash})[VIEW](el);
  if(!DEV)setupDevice();
  paintSync()}

/* ================= home ================= */
function vHome(el){
  const m=month(),A=active(),M=A.filter(i=>(i.date||'').startsWith(m));
  const sales=M.reduce((a,i)=>a+n(i.total),0),col=M.reduce((a,i)=>a+paidOf(i),0);
  const allRem=A.reduce((a,i)=>a+remOf(i),0);
  const reps={};A.forEach(i=>{const r=i.rep||'';if(!r)return;const o=reps[r]=reps[r]||{mc:0,ac:0,mt:0,mp:0,at:0,ap:0};
    o.ac++;o.at+=n(i.total);o.ap+=paidOf(i);if((i.date||'').startsWith(m)){o.mc++;o.mt+=n(i.total);o.mp+=paidOf(i)}});
  const debt=Object.values(DB.customers).map(c=>{const iv=invsOf(c);return{c,r:iv.reduce((a,i)=>a+remOf(i),0)}}).filter(x=>x.r>0).sort((a,b)=>b.r-a.r).slice(0,8);
  const mName=new Date().toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
  el.innerHTML=`<h1>أهلاً${DEV?' يا '+esc(DEV.name):''}</h1><p class="sub">${mName}</p>
  <div class="grid g4">
    <div class="card stat"><div class="k">مبيعات الشهر</div><div class="v num">${money(sales)}</div></div>
    <div class="card stat"><div class="k">اتحصّل الشهر</div><div class="v num">${money(col)}</div></div>
    <div class="card stat"><div class="k">فواتير الشهر</div><div class="v num">${M.length}</div></div>
    <div class="card stat"><div class="k">كل الفلوس اللي برّه</div><div class="v num" style="color:var(--warn)">${money(allRem)}</div></div>
  </div>
  <div class="grid g2">
   <div class="card"><h2>مبيعات كل سيلز</h2>${Object.keys(reps).length?`<table class="t"><tr><th>السيلز</th><th>الشهر ده</th><th>الإجمالي</th><th>محصّل</th></tr>
    ${Object.entries(reps).sort((a,b)=>b[1].at-a[1].at).map(([r,o])=>`<tr><td><b>${esc(r)}</b></td><td class="num">${money(o.mt)} <span class="muted">· ${o.mc} فاتورة</span></td><td class="num">${money(o.at)} <span class="muted">· ${o.ac}</span></td><td class="num">${money(o.ap)}</td></tr>`).join('')}</table>`:'<div class="empty">لسه مفيش فواتير عليها اسم سيلز</div>'}</div>
   <div class="card"><h2>عليهم فلوس</h2>${debt.length?`<table class="t">${debt.map(x=>`<tr class="click" onclick="go('cust','${x.c.id}')"><td>${esc(x.c.name)} ${x.c.type==='trader'?'<span class="tag">تاجر</span>':''}</td><td class="num bal" style="color:var(--warn)">${money(x.r)}</td></tr>`).join('')}</table>`:'<div class="empty">كله مدفوع 👌</div>'}</div>
  </div>
  <div class="card"><div class="row"><h2 style="margin:0">آخر الفواتير</h2><button class="btn sm right" onclick="go('list')">كل الفواتير</button></div>
  ${invTable(A.sort(byDate).reverse().slice(0,8))}</div>`}

function invTable(rows){
  if(!rows.length)return'<div class="empty">مفيش فواتير</div>';
  return `<table class="t"><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>السيلز</th><th>جهاز</th></tr>
  ${rows.map(i=>{const r=remOf(i);return `<tr class="click" onclick="go('inv','${i.id}')"><td class="num muted">${esc(i.no)}</td><td class="num">${arDate(i.date)}</td>
  <td>${esc(i.customer)} ${i.ctype==='trader'?'<span class="tag">تاجر · '+LINES[lineOf(i)]+'</span>':''}</td><td class="num">${money(i.total)}</td>
  <td>${r<=0?'<span class="tag ok">مدفوعة</span>':`<span class="tag bad">باقي ${money(r)}</span>`}</td><td>${esc(i.rep||'')}</td><td class="muted">${esc(i.device||'')}</td></tr>`}).join('')}</table>`}

/* ================= invoice form ================= */
let F=null;
function blankForm(o){return Object.assign({id:null,ctype:'retail',line:'tulle',custId:null,customer:'',phone:'',address:'',date:today(),
  items:[],discType:'auto',discValue:0,rep:'',notes:'',payNow:null,payMethod:'كاش',payTouched:false},o||{})}
function newInvoice(pre){F=blankForm(pre);if(!F.items.length&&!(pre&&pre.noItem))F.items.push(newItem(F.ctype==='trader'&&F.line!=='tulle'?F.line:'tulle'));go('new','keep')}
function newItem(kind){const s=S();
  if(kind==='stretch')return{kind:'stretch',qty:1,price:s.stretchPrice,unit:'توب'};
  if(kind==='lace')return{kind:'lace',name:'فرنش ليس',qty:1,price:0,unit:'كوب'};
  if(kind==='other')return{kind:'other',name:'',qty:1,price:0,unit:'قطعة'};
  return{kind:'tulle',width:'160',color:'',qty:1,price:s.price160,unit:'توب'}}
function editInvoice(id){const i=DB.invoices[id];const c=custOfInv(i);
  F=blankForm({id,ctype:i.ctype||'retail',line:lineOf(i),custId:c?c.id:null,customer:i.customer,phone:i.phone,address:i.address,date:i.date,
   items:clone(i.items||[]).map(it=>it.kind==='tulle'?Object.assign(it,{width:itemWidth(it),color:itemColor(it)}):it),
   discType:i.discType==='none'?'none':(i.discType||'auto'),discValue:i.discType==='pct'?parseFloat(i.discLabel)||n(i.discValue):(i.discType==='amt'?n(i.discount):n(i.discValue)),
   rep:i.rep||'',notes:i.notes||''});go('new','keep')}
function formCust(){if(F.custId&&DB.customers[F.custId])return DB.customers[F.custId];return{type:F.ctype}}
function formInv(){const inv={items:F.items.map(it=>{const x=Object.assign({},it);if(x.kind==='tulle')x.name=tulleName(x.width,x.color);if(x.kind==='stretch')x.name=x.name||'تل استرتش';return x}),discType:F.discType,discValue:F.discValue,payments:[]};
  const c=formCust();return calc(inv,F.custId?c:{type:F.ctype})}

function vNew(el){
  if(!F)F=blankForm({items:[newItem('tulle')]});
  const s=S(),reps=s.reps,cm=colorMap();
  const custList=Object.values(DB.customers).filter(c=>!c.deleted).sort((a,b)=>a.name.localeCompare(b.name,'ar'));

     items:items.map(it=>{const x=Object.assign({},it);if(x.kind==='tulle')x.name=tulleName(x.width,x.color);if(x.kind==='stretch')x.name=x.name||'تل استرتش';x.qty=n(x.qty);x.price=n(x.price);return x})});
  if(old&&old.opening&&!items.length){inv.opening=true}else delete inv.opening;
  if(!old&&n(F.payNow)>0)inv.payments=[{id:uid(),date:F.date,amount:n(F.payNow),method:F.payMethod,by:DEV?DEV.name:''}];
  inv.method=(inv.payments[0]&&inv.payments[0].method)||F.payMethod;
  if(isPayOnly&&!inv.opening){inv.note=inv.note||'دفعة'}

function stmtLines(c){ // returns [{line, rows, debit, credit}]
  const iv=invsOf(c),groups={};
  iv.forEach(i=>{const l=c.type==='trader'?lineOf(i):'all';(groups[l]=groups[l]||[]).push(i)});
  const order=c.type==='trader'?['tulle','stretch','lace','other']:['all'];
  return order.filter(l=>groups[l]).map(l=>{const rows=[];
    groups[l].forEach(i=>{if(n(i.total)>0||i.opening)rows.push({date:i.date,ca:i.createdAt||'',k:0,desc:itemsSummary(i)+(n(i.discount)?` (خصم ${i.discLabel||money(i.discount)})`:''),qty:(i.items||[]).reduce((a,x)=>a+n(x.qty),0),debit:n(i.total),inv:i.id});
      (i.payments||[]).forEach(p=>rows.push({date:p.date,ca:i.createdAt||'',k:1,desc:'دفعة — '+(p.method||''),credit:n(p.amount),inv:i.id}))});
    rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.k-b.k||a.ca.localeCompare(b.ca));
    let bal=0;rows.forEach(r=>{bal+=n(r.debit)-n(r.credit);r.bal=bal});
    return{line:l,rows,debit:rows.reduce((a,r)=>a+n(r.debit),0),credit:rows.reduce((a,r)=>a+n(r.credit),0)}})}

   <div class="row right"><button class="btn" onclick="custModal('${c.id}')">تعديل البيانات</button><button class="btn p" onclick="printStatement('${c.id}')">طباعة كشف الحساب</button></div></div>
  <div class="grid g3">

   <div class="card stat"><div class="k">إجمالي اللي دفعه</div><div class="v num credit">${money(L.reduce((a,x)=>a+x.credit,0))}</div></div>

  ${ci?`<div class="card"><b>التعاقد:</b> ${ci.rolls} توب بخصم ${ci.disc}% · اتسحب <b>${ci.took}</b> توب · باقي <b>${ci.left}</b> توب</div>`:''}

    ${c.type==='trader'?`<button class="btn sm p" onclick="newInvoice({ctype:'trader',custId:'${c.id}',customer:${esc(JSON.stringify(c.name))},phone:${esc(JSON.stringify(c.phone||''))},address:${esc(JSON.stringify(c.address||''))}})">+ سحب بضاعة</button>
      <button class="btn sm" onclick="traderPay('${c.id}')">+ دفعة</button>`
     :`<button class="btn sm p" onclick="newInvoice({ctype:'retail',custId:'${c.id}',customer:${esc(JSON.stringify(c.name))},phone:${esc(JSON.stringify(c.phone||''))},address:${esc(JSON.stringify(c.address||''))}})">+ فاتورة</button>`}</div>

function traderPay(cid){const c=DB.customers[cid];

function exportBackup(){const blob=new Blob([JSON.stringify({db:DB},null,0)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='luvina-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ================= sync (GitHub private repo, offline-first) ================= */
let syncing=false,syncTimer=null,syncState={s:'idle',msg:''};
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
function merge(a,b){const out={};COLLS.forEach(c=>{const A=(a&&a[c])||{},B=(b&&b[c])||{};out[c]={};
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const x=A[k],y=B[k];out[c][k]=!x?y:!y?x:(n(y.u)>n(x.u)?y:x)})});return out}
function b64e(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const bin=atob(s.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function gh(cfg,path,opt){const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,Object.assign({cache:'no-store'},opt,{headers:Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},(opt||{}).headers||{})}));return r}
async function syncNow(){const cfg=lsGet(LS_SYNC);
  if(!cfg||!cfg.repo||!cfg.token){syncState={s:'off',msg:'محفوظ على الجهاز بس'};paintSync();return}
  if(!navigator.onLine){syncState={s:'wait',msg:'من غير نت — محفوظ على الجهاز'};paintSync();return}
  if(syncing){scheduleSync();return}syncing=true;syncState={s:'busy',msg:'بيتزامن...'};paintSync();
  try{for(let t=0;t<4;t++){
      const g=await gh(cfg,'/contents/data.json');let sha=null,remote=null;
      if(g.status===200){const j=await g.json();sha=j.sha;let txt;
        if(j.content&&j.encoding==='base64')txt=b64d(j.content);else{const bl=await gh(cfg,'/git/blobs/'+j.sha);txt=b64d((await bl.json()).content)}
        remote=JSON.parse(txt)}
      else if(g.status!==404)throw new Error(g.status===401?'كود المزامنة غلط':'خطأ '+g.status);
      const merged=merge(DB,remote);const before=JSON.stringify(DB);DB=merged;if(JSON.stringify(DB)!==before){lsSet(LS_DATA,DB);if(!document.getElementById('mbg'))render()}
      if(remote&&JSON.stringify(merge(remote,{}))===JSON.stringify(merge(DB,{}))){break}
      const p=await gh(cfg,'/contents/data.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'sync '+(DEV?DEV.name:''),content:b64e(JSON.stringify(DB)),sha:sha||undefined})});
      if(p.ok)break;if(p.status===409||p.status===422)continue;throw new Error('خطأ '+p.status)}
    cfg.last=Date.now();lsSet(LS_SYNC,cfg);syncState={s:'ok',msg:'متزامن ✓'}}
  catch(e){syncState={s:'bad',msg:'المزامنة وقفت — محفوظ على الجهاز'};console.warn(e)}
  syncing=false;paintSync()}
function paintSync(){const p=document.getElementById('syncPill');if(!p)return;p.textContent=syncState.msg||'محفوظ على الجهاز';
  p.className='pill '+(syncState.s==='ok'?'ok':syncState.s==='bad'?'bad':'');p.onclick=()=>{syncNow()}}
async function saveSync(){const repo=yR.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token=yT.value.trim();
  lsSet(LS_SYNC,Object.assign(lsGet(LS_SYNC)||{},{repo,token}));await syncNow();toast(syncState.msg);vMore(view)}
window.addEventListener('online',syncNow);setInterval(syncNow,60000);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const view=document.getElementById('view');
render();syncNow();
</script>
