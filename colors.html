<style>
/* Layout: one-screen 10×10 swatch wall in the site's soft palette; tap a swatch to see it large and add it to a WhatsApp list */
:root{
  --bg:#FDFBF8; --alt:#F8F3EE; --ink:#3D3330; --soft:#8E7F76; --line:#EAE0D7;
  --acc:#B89C80; --acc-h:#A88B6E; --link:#9E8061;
  --f-ar:'Alexandria','SF Arabic','Segoe UI',Tahoma,sans-serif;
  --f-ar-d:'Reem Kufi','Alexandria',sans-serif;
  --f-en:'Inter','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.28,.11,.32,1);
  --nav:44px; --bar:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{height:var(--nav);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(253,251,248,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header .logo{font-family:var(--f-en);font-weight:600;font-size:15px;letter-spacing:.32em;padding-inline-start:.32em;direction:ltr;min-height:44px;display:flex;align-items:center}
header .back{font-size:13px;color:var(--link);min-height:44px;display:flex;align-items:center}

.head{flex:0 0 auto;text-align:center;padding:10px 16px 12px}
.head h1{margin:0;font-family:var(--f-ar-d);font-weight:500;font-size:clamp(24px,3.4vw,34px);line-height:1.25}
.head p{margin:2px 0 0;font-size:13px;color:var(--soft)}
.head .legend{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--ink)}

/* the wall: always 10×10, sized to fit the remaining screen */
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:0 12px calc(12px + var(--bar) + env(safe-area-inset-bottom,0px));transition:padding .35s var(--ease)}
.wall{--s:min(calc((100vw - 24px - 9*var(--g)) / 10), calc((100dvh - var(--nav) - 96px - var(--bar) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 9*var(--g)) / 10), 96px);
  --g:clamp(3px,.6vw,8px);
  display:grid;grid-template-columns:repeat(10,var(--s));grid-auto-rows:var(--s);gap:var(--g);direction:ltr}
.sw{position:relative;padding:0;border:0;border-radius:calc(var(--s) * .16);overflow:hidden;cursor:pointer;background:var(--alt);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.sw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:80% 22%;transform:scale(2.2);transform-origin:80% 22%}
.sw .c{position:absolute;inset:auto 0 0 0;font-family:var(--f-en);font-weight:500;font-size:clamp(8px,calc(var(--s) * .2),13px);line-height:1;padding:0 0 calc(var(--s) * .1);text-align:center;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.lt .c{color:rgba(40,32,28,.85);text-shadow:none}
.sw .w3{position:absolute;top:calc(var(--s) * .1);inset-inline-start:calc(var(--s) * .1);width:clamp(5px,calc(var(--s) * .12),8px);height:clamp(5px,calc(var(--s) * .12),8px);border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
.sw:hover{transform:scale(1.06);z-index:2;box-shadow:0 6px 18px rgba(60,40,30,.18)}
.sw.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw.sel::after{content:"✓";position:absolute;top:calc(var(--s) * .08);inset-inline-end:calc(var(--s) * .08);width:clamp(12px,calc(var(--s) * .3),20px);height:clamp(12px,calc(var(--s) * .3),20px);border-radius:50%;background:var(--ink);color:#fff;font-size:clamp(8px,calc(var(--s) * .18),12px);display:flex;align-items:center;justify-content:center}

/* selection bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(253,251,248,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);transform:translateY(100%);transition:transform .35s var(--ease)}
.bar.on{transform:none}
.bar .info{flex:1;min-width:0}
.bar .info b{display:block;font-weight:500;font-size:14px}
.bar .info span{display:block;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .clr{background:none;border:0;color:var(--soft);font-size:13px;cursor:pointer;min-height:44px;padding:0 6px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:980px;background:var(--acc);border:1px solid var(--acc);color:#fff;font-size:15px;cursor:pointer;white-space:nowrap;transition:background .2s}
.pill:hover{background:var(--acc-h)}
.pill.ghost{background:transparent;color:#8A6E52;border-color:var(--acc)}
.pill.ghost:hover{background:var(--acc);color:#fff}

/* preview sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(61,51,48,.28);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sheet.on{opacity:1;pointer-events:auto}
.card{width:min(560px,100%);background:var(--bg);border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .35s var(--ease)}
.sheet.on .card{transform:none}
@media (min-width:700px){.sheet{align-items:center}.card{border-radius:24px}}
.card .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.card .ph{position:relative;aspect-ratio:47/28;border-radius:16px;overflow:hidden;background:var(--alt)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.card .code{font-family:var(--f-en);font-weight:600;font-size:30px;letter-spacing:-.02em;direction:ltr}
.card .wd{font-size:13px;color:var(--soft);margin-top:2px}
.card .nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.card .nav button{background:none;border:0;color:var(--link);font-size:14px;cursor:pointer;min-height:44px;padding:0 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="logo" href="./" aria-label="LUVINA">LUVINA</a>
    <a class="back" href="./">‹ الرئيسية</a>
  </header>
  <div class="head">
    <h1>الألوان المئة</h1>
    <p>اضغط على أي لون لتراه بالحجم الكامل وتضيفه لاختيارك. <span class="legend"><span class="dot"></span> متاح بعرض ٣ متر</span></p>
  </div>
  <div class="stage" id="stage"><div class="wall" id="wall" role="list" aria-label="الألوان المئة"></div></div>
</div>

<div class="bar" id="bar">
  <div class="info"><b id="cnt"></b><span class="num" id="lst"></span></div>
  <button class="clr" id="clr" type="button">مسح</button>
  <a class="pill" id="send" target="_blank" rel="noopener">أرسل عبر واتساب</a>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pvCode">
    <div class="grab"></div>
    <div class="ph"><img id="pvImg" alt=""></div>
    <div class="row">
      <div><div class="code" id="pvCode"></div><div class="wd" id="pvWd"></div></div>
      <button class="pill" id="pvPick" type="button"></button>
    </div>
    <div class="nav"><button type="button" id="pvPrev">‹ السابق</button><button type="button" id="pvClose">إغلاق</button><button type="button" id="pvNext">التالي ›</button></div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var pad=function(n){return ('00'+n).slice(-3);};
  /* order: whites → skins → nudes → blush → pink → red → wine → lilac → blue → aqua → teal → sage → olive → yellow → orange → brown → grey → black */
  var ORDER=[93,7,6,78,71,42,22,94,3,66,1,35,51,53,46,29,50,25,32,54,82,69,27,84,72,88,89,4,34,100,30,24,47,39,57,60,64,62,44,38,59,56,98,92,13,11,83,9,10,67,61,63,86,75,18,99,17,20,43,21,15,81,97,85,91,77,36,5,90,55,28,74,23,95,40,33,68,70,45,58,12,79,19,31,26,87,65,49,2,37,52,14,16,96,80,41,76,73,48,8];
  var LIGHT='0010011000111101001001001010101100000000010001000100010000000000010000110000011010011100001111001100';
  var ONLY3=[3,6,7], ALSO3=[8,87,94];
  var wd=function(n){return ONLY3.indexOf(n)>-1?'عرض ٣ متر فقط':ALSO3.indexOf(n)>-1?'عرض ١٦٠ سم و٣ متر':'عرض ١٦٠ سم';};
  var sel=[];try{sel=JSON.parse(localStorage.getItem('lv_sel')||'[]').filter(function(n){return n>=1&&n<=100;});}catch(e){}
  var save=function(){try{localStorage.setItem('lv_sel',JSON.stringify(sel));}catch(e){}};

  var wall=$('wall');
  wall.innerHTML=ORDER.map(function(n){
    var w3=ONLY3.indexOf(n)>-1||ALSO3.indexOf(n)>-1;
    return '<button class="sw'+(LIGHT[n-1]==='1'?' lt':'')+'" type="button" role="listitem" data-n="'+n+'" aria-label="لون '+pad(n)+'"><img src="luvina-'+pad(n)+'.jpg" alt="" loading="eager" decoding="async"><span class="c">'+pad(n)+'</span>'+(w3?'<span class="w3"></span>':'')+'</button>';
  }).join('');
  wall.addEventListener('click',function(e){var b=e.target.closest('.sw');if(b)open(+b.dataset.n);});

  function toggle(n){var i=sel.indexOf(n);if(i>-1)sel.splice(i,1);else sel.push(n);save();paint();}
  function paint(){
    Array.prototype.forEach.call(wall.children,function(b){b.classList.toggle('sel',sel.indexOf(+b.dataset.n)>-1);});
    var k=sel.length;
    $('bar').classList.toggle('on',k>0);
    document.documentElement.style.setProperty('--bar',k>0?'68px':'0px');
    $('cnt').textContent=k===1?'لون واحد':k===2?'لونان':k+(k<=10?' ألوان':' لوناً');
    $('lst').textContent=sel.map(pad).join(' · ');
    $('send').href='https://wa.me/201270455444?text='+encodeURIComponent('أهلاً لوفينا، أود الاستفسار عن هذه الألوان من التل السويسري:\n'+sel.map(function(n){return '• لون '+pad(n)+' ('+wd(n)+')';}).join('\n'));
    if(cur){var on=sel.indexOf(cur)>-1;$('pvPick').textContent=on?'✓ مُضاف':'أضف للاختيار';$('pvPick').className=on?'pill ghost':'pill';}
  }
  var cur=0;
  function open(n){cur=n;$('pvImg').src='luvina-'+pad(n)+'.jpg';$('pvCode').textContent='N° '+pad(n);$('pvWd').textContent=wd(n);$('sheet').classList.add('on');$('sheet').setAttribute('aria-hidden','false');paint();}
  function close(){$('sheet').classList.remove('on');$('sheet').setAttribute('aria-hidden','true');cur=0;}
  function step(d){var i=ORDER.indexOf(cur);open(ORDER[(i+d+100)%100]);}
  $('pvPick').onclick=function(){toggle(cur);};
  $('pvClose').onclick=close;
  $('pvPrev').onclick=function(){step(-1);};
  $('pvNext').onclick=function(){step(1);};
  $('sheet').addEventListener('click',function(e){if(e.target===this)close();});
  $('clr').onclick=function(){sel=[];save();paint();};
  addEventListener('keydown',function(e){if(!cur)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(1);if(e.key==='ArrowRight')step(-1);});
  var sx=null;$('sheet').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  $('sheet').addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null;});
  paint();
  var h=parseInt(location.hash.slice(1),10);if(h>=1&&h<=100)open(h);
})();
</script>
