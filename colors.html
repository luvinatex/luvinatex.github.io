<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUVINA Colors</title>
<meta name="description" content="كتالوج ألوان لوفينا — 100 لون تل سويسري فاخر. اختار الألوان اللي عايزها وابعتها على واتساب.">
<meta property="og:title" content="LUVINA — 100 Colors">
<meta property="og:image" content="luvina-044.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Kufi+Arabic:wght@200;300;400&display=swap">
<style>
:root{--on-dark:#F3DCEB;--muted:#B394A8;--f-latin:"Bodoni Moda","Didot",Georgia,serif;--f-ar:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#120812;color:var(--on-dark);font-family:var(--f-ar);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
    .cb{position:fixed;inset:0;z-index:200;background:#120812;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
    .cb.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
    .cb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(243,220,235,.1)}
    .cb-head .t{font-family:var(--f-latin);letter-spacing:.3em;font-size:15px;direction:ltr}
    .cb-head .t small{display:block;font-size:9px;letter-spacing:.35em;color:var(--muted)}
    .cb-x{background:none;border:0;color:var(--on-dark);font-size:30px;line-height:1;padding:4px 8px;cursor:pointer;font-family:var(--f-latin)}
    .cb-tip{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 0}
    .cb-grid{flex:1;overflow-y:auto;padding:12px 12px 110px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:max-content;gap:8px;align-content:start;min-height:0;-webkit-overflow-scrolling:touch}
    @media (min-width:640px){.cb-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:16px 24px 120px}}
    @media (min-width:1000px){.cb-grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
    .sw2{position:relative;display:block;padding:0;border:0;background:#1d0f1c;cursor:zoom-in;height:0;padding-bottom:133%;overflow:hidden;border-radius:2px;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s}
    .sw2 img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:85% 25%;display:block}
    .sw2 .c{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-family:var(--f-latin);font-style:italic;font-size:13px;color:#fff;direction:ltr;text-align:left;background:linear-gradient(180deg,transparent,rgba(0,0,0,.5))}
    .sw2 .k{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;padding:0;cursor:pointer}
    .sw2 .k::before{content:"";position:absolute;inset:-10px}
    .cb-grid .fam{grid-column:1/-1;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:14px 2px 2px;border-top:1px solid rgba(243,220,235,.12);margin-top:4px}
    .cb-grid .fam:first-child{border-top:0;margin-top:0;padding-top:2px}
    .sw2 .w3{position:absolute;top:8px;left:5px;z-index:1;font-size:9px !important;padding:1px 4px !important;white-space:nowrap;font-size:10px;line-height:1.4;background:rgba(18,8,18,.78);color:#F3DCEB;padding:2px 6px;border-radius:2px}
    .sw2.sel{outline-color:var(--on-dark)}
    .sw2.sel .k{background:var(--on-dark);border-color:var(--on-dark);color:#2b1a25}
    .cb-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(18,8,18,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(243,220,235,.12);display:flex;align-items:center;gap:12px;transform:translateY(100%);transition:transform .35s ease}
    .cb-bar.on{transform:none}
    .cb-bar .info{flex:1;min-width:0}
    .cb-bar .info b{font-weight:400;font-size:14px;display:block}
    .cb-bar .info span{display:block;font-family:var(--f-latin);font-style:italic;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
    .cb-bar .clr{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
    .cb-send{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#0b2414;text-decoration:none;font-size:14px;font-weight:400;padding:12px 16px;border-radius:2px}
    .cb-lb{position:absolute;inset:0;z-index:5;background:rgba(10,4,10,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:18px}
    .cb-lb.on{display:flex}
    .cb-lb img{width:min(900px,100%);aspect-ratio:47/28;object-fit:cover;display:block;box-shadow:0 30px 80px rgba(0,0,0,.6)}
    .cb-lb .row{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .cb-lb .code{font-family:var(--f-latin);font-style:italic;font-size:40px;line-height:1;direction:ltr}
    .cb-lb .pick{font:inherit;font-size:14px;padding:12px 20px;border:1px solid var(--on-dark);background:transparent;color:var(--on-dark);cursor:pointer}
    .cb-lb .pick.sel{background:var(--on-dark);color:#2b1a25}
    .cb-lb .nv{display:flex;gap:28px;font-family:var(--f-latin);font-size:34px}
    .cb-lb .nv button,.cb-lb .bx{background:none;border:0;color:var(--on-dark);cursor:pointer;font:inherit;padding:4px 10px}
    .cb-lb .bx{position:absolute;top:12px;left:12px;font-family:var(--f-latin);font-size:30px}
    </style>
</head>
<body>
    <div class="cb on" id="cb" role="dialog" aria-modal="true" aria-label="كتالوج الألوان">
      <div class="cb-head"><div class="t">LUVINA<small>THE COLOUR BOOK · 100</small></div><a class="cb-x" href="./" aria-label="الصفحة الرئيسية" style="text-decoration:none;font-size:13px;font-family:var(--f-ar)">← الرئيسية</a></div>
      <div class="cb-tip">دوس على اللون يكبر — وعلّم ✓ على كل الألوان اللي عايزها وابعتهم مرة واحدة</div>
      <div class="cb-grid" id="cbGrid"></div>
      <div class="cb-bar" id="cbBar">
        <div class="info"><b id="cbN"></b><span id="cbList"></span></div>
        <button class="clr" id="cbClr">مسح</button>
        <a class="cb-send" id="cbSend" target="_blank" rel="noopener">ابعتهم واتساب</a>
      </div>
      <div class="cb-lb" id="cbLb">
        <button class="bx" id="lbX2" aria-label="رجوع">×</button>
        <img id="lbImg2" alt="">
        <div class="row"><div class="code" id="lbCode2"></div><button class="pick" id="lbPick">✓ اختار اللون ده</button></div>
        <div class="nv"><button id="lbN2" aria-label="التالي">›</button><button id="lbP2" aria-label="السابق">‹</button></div>
      </div>
    </div>
    <script>(function(){
      var p=function(n){return String(n).padStart(3,'0')},$=function(i){return document.getElementById(i)},T={3:"3 متر فقط",6:"3 متر فقط",7:"3 متر فقط",8:"+ 3 متر",87:"+ 3 متر",94:"+ 3 متر"},F=[["أبيض وأوف وايت · WHITE & IVORY",[93,7,6,78,94,71]],["نيود وبيج · NUDE & BEIGE",[46,29,54,82,25,32,50,42,22,3,66,69]],["بلاش وروز · BLUSH & ROSE",[27,84,72,88,89,4,34]],["بينك وفوشيا · PINK & FUCHSIA",[100,30,24]],["أحمر · RED",[47,39,57]],["نبيتي وبرجندي · WINE & BURGUNDY",[60,64,62,44,38,59,56]],["ليلك وبنفسجي · LILAC & PURPLE",[98,92,13,11,83,9,10,67,61,63]],["أزرق وكحلي · BLUE & NAVY",[86,75,18,99,17,20,43,21,15]],["أكوا ومنت · AQUA & MINT",[81,97,85,91]],["تركواز وبترولي · TEAL & PETROL",[77,36,5,90,55]],["سيج وأخضر · SAGE & GREEN",[28,74,23,95,40,33]],["زيتي وكاكي · OLIVE & KHAKI",[68,70,45,58]],["أصفر ودهبي · YELLOW & GOLD",[12,79,19,31]],["برتقالي وقرفة · ORANGE & CINNAMON",[26,87]],["كامل وبني · CAMEL & BROWN",[65,1,35,49,2,53,37,51,52]],["رمادي وسيلفر · GREY & SILVER",[14,16,96,80,41,76,73,48]],["أسود · BLACK",[8]]],O=[].concat.apply([],F.map(function(f){return f[1]}));
      var cb=$('cb'),grid=$('cbGrid'),sel=[],cur=1,built=false;
      try{sel=JSON.parse(localStorage.getItem('lv_sel')||'[]').filter(function(n){return n>=1&&n<=100})}catch(e){sel=[]}
      function save(){try{localStorage.setItem('lv_sel',JSON.stringify(sel))}catch(e){}}
      function build(){if(built)return;built=true;var h='';F.forEach(function(f){h+='<div class="fam">'+f[0]+'</div>';f[1].forEach(function(n){h+='<div class="sw2" data-n="'+n+'" role="button" tabindex="0" aria-label="لون '+n+'"><img loading="lazy" decoding="async" src="luvina-'+p(n)+'.jpg" alt=""><span class="c">'+p(n)+'</span>'+(T[n]?'<span class="w3">'+T[n]+'</span>':'')+'<button class="k" type="button" aria-label="اختار لون '+n+'">✓</button></div>'})});grid.innerHTML=h;
        grid.addEventListener('click',function(e){var s=e.target.closest('.sw2');if(!s)return;var n=+s.dataset.n;if(e.target.closest('.k')){toggle(n)}else{show(n)}});paint()}
      function toggle(n){var i=sel.indexOf(n);if(i>-1)sel.splice(i,1);else sel.push(n);save();paint()}
      function paint(){[].forEach.call(grid.children,function(s){s.classList.toggle('sel',sel.indexOf(+s.dataset.n)>-1)});
        $('cbBar').classList.toggle('on',sel.length>0);$('cbN').textContent=sel.length===1?'اخترت لون واحد':sel.length===2?'اخترت لونين':'اخترت '+sel.length+(sel.length<=10?' ألوان':' لون');
        $('cbList').textContent=sel.map(p).join(' · ');
        $('cbSend').href='https://wa.me/201270455444?text='+encodeURIComponent('أهلاً لوفينا، عايز أسأل على الألوان دي من كتالوج التل:\n'+sel.map(function(n){return '• لون رقم '+n+(T[n]?(T[n]==='3 متر فقط'?' (عرض 3 متر)':' (160 سم أو 3 متر)'):'')}).join('\n'));
        var on=sel.indexOf(cur)>-1,b=$('lbPick');b.classList.toggle('sel',on);b.textContent=on?'✓ اتختار — شيله':'✓ اختار اللون ده'}
      function show(n){cur=(n-1+100)%100+1;$('lbImg2').src='luvina-'+p(cur)+'.jpg';$('lbCode2').textContent='N° '+p(cur)+(T[cur]?' · '+T[cur]:'');$('cbLb').classList.add('on');paint()}
      function nx(k){var i=O.indexOf(cur);show(O[(i+k+O.length)%O.length])}
      function hideLb(){$('cbLb').classList.remove('on')}
      build();var h0=parseInt(location.hash.slice(1),10);if(h0>=1&&h0<=100)show(h0);
$('lbX2').onclick=hideLb;$('lbPick').onclick=function(){toggle(cur)};
      $('lbN2').onclick=function(){nx(1)};$('lbP2').onclick=function(){nx(-1)};
      $('cbClr').onclick=function(){sel=[];save();paint()};
      var sx=null;$('cbLb').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
      $('cbLb').addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)nx(d<0?1:-1);sx=null});
      addEventListener('keydown',function(e){if(!cb.classList.contains('on'))return;if(e.key==='Escape'){hideLb()}if($('cbLb').classList.contains('on')){if(e.key==='ArrowLeft')nx(1);if(e.key==='ArrowRight')nx(-1)}});
    })();</script>
</body>
</html>
