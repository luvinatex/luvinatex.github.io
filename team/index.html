<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luvina Team</title>
<meta name="theme-color" content="#f7f2ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Reem+Kufi:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ec;--bg2:#efe6db;--card:#fffdfa;--ink:#2b211d;--soft:#6f625a;--line:#e8ddd0;
  --gold:#b38b55;--gold2:#d9bb8a;--wine:#7a2e36;--wine2:#9b4a52;--nude:#e9d3c3;--ok:#6f8f69;
  --sh:0 1px 2px rgba(60,40,30,.05),0 8px 24px -12px rgba(60,40,30,.18);
  --serif:"Amiri",Georgia,serif;--sans:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{background:
  radial-gradient(circle at 1px 1px,rgba(179,139,85,.10) 1px,transparent 1.4px) 0 0/14px 14px,
  linear-gradient(180deg,#fbf7f2 0%,var(--bg) 40%,var(--bg2) 100%)}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
.serif{font-family:var(--serif)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}
#login:before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 70% 20%,rgba(217,187,138,.35),transparent 70%),radial-gradient(35% 30% at 20% 85%,rgba(122,46,54,.12),transparent 70%)}
.lbox{position:relative;width:100%;max-width:380px;text-align:center;animation:up .6s ease}
.mono{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold2);font-family:var(--serif);font-size:30px;letter-spacing:.04em;box-shadow:0 10px 30px -10px rgba(43,33,29,.6)}
.lbox h1{font-family:var(--serif);font-weight:700;font-size:46px;letter-spacing:.14em;margin:0}
.lbox .sub{color:var(--soft);font-size:14px;margin:6px 0 30px}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,253,250,.9);outline:none;font-size:16px;transition:.2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(179,139,85,.15)}
.cta{width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ink),#4a3830);box-shadow:var(--sh);transition:.15s}
.cta:active{transform:scale(.98)}
.err{color:var(--wine);font-size:14px;min-height:22px;margin-top:12px}
.lfoot{margin-top:26px;font-size:11px;letter-spacing:.25em;color:var(--gold)}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
header{padding:14px 18px 10px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header .mono{width:42px;height:42px;font-size:17px;margin:0;box-shadow:none}
.hi{flex:1;min-width:0}
.hi .t{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.2}
.hi .s{font-size:12px;color:var(--soft);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--gold)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--soft)}
.tabs{display:flex;gap:6px;padding:0 18px 10px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;font-weight:500;color:var(--soft);transition:.2s}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh)}
main{flex:1;overflow:auto;padding:6px 18px 18px;scroll-behavior:smooth}

/* ---------- home / chat ---------- */
.tip{position:relative;border-radius:20px;padding:20px 20px 18px;margin:6px 0 16px;color:#fbf5ee;overflow:hidden;
  background:linear-gradient(135deg,#2b211d 0%,#4b2a2e 60%,#7a2e36 100%);box-shadow:var(--sh);animation:up .5s ease}
.tip:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/10px 10px;pointer-events:none}
.tip .k{font-size:11px;letter-spacing:.2em;color:var(--gold2)}
.tip .h{font-family:var(--serif);font-size:22px;margin:6px 0 6px}
.tip .b{font-size:14px;line-height:1.8;opacity:.9}
.tip button{margin-top:12px;border:1px solid rgba(217,187,138,.5);background:rgba(255,255,255,.06);color:var(--gold2);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:right;box-shadow:var(--sh);transition:.15s;animation:up .5s ease both}
.tile:active{transform:scale(.97)}
.tile .e{font-size:22px}
.tile .n{font-weight:600;margin-top:6px;font-size:14px}
.tile .d{font-size:12px;color:var(--soft);margin-top:2px}

.msg{display:flex;gap:10px;margin-bottom:14px;animation:up .35s ease}
.msg.me{flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold2);font-family:var(--serif);font-size:14px}
.me .av{display:none}
.bub{max-width:86%;padding:13px 16px;border-radius:18px;line-height:1.85;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bot .bub{background:var(--card);border:1px solid var(--line);border-top-right-radius:6px;box-shadow:var(--sh)}
.me .bub{background:var(--ink);color:#fbf5ee;border-top-left-radius:6px}
.bub b{color:var(--wine);font-weight:600}
.bub .lead{color:var(--soft);font-size:14px;display:block;margin-bottom:2px}
.bub .ttl{font-family:var(--serif);font-size:20px;font-weight:700;display:block;margin-bottom:4px;color:var(--ink)}
.typing .bub{display:flex;gap:5px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.rel{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rel .lbl{font-size:12px;color:var(--soft);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip:active{background:var(--nude)}
.calc{border-collapse:collapse;width:100%;margin:6px 0;font-size:14px}
.calc td{padding:6px 0;border-bottom:1px dashed var(--line)}
.calc td:last-child{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc tr.tot td{font-weight:700;color:var(--wine);border:0;font-size:17px;padding-top:10px}

.quick{display:flex;gap:6px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{white-space:nowrap;background:var(--card)}
.bar{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,253,250,.85);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar input{flex:1;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;outline:none;font-size:16px;transition:.2s}
.bar input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(179,139,85,.12)}
.send{width:52px;border:0;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;font-size:20px;display:grid;place-items:center}
.send:active{transform:scale(.95)}

/* ---------- library ---------- */
.search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);outline:none;margin:4px 0 8px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{white-space:nowrap;background:var(--card)}
.cats .chip.on{background:var(--ink);color:#fbf5ee;border-color:var(--ink)}
.cat{font-family:var(--serif);font-size:24px;margin:20px 0 10px;color:var(--wine)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:var(--sh);overflow:hidden}
.card .h{padding:15px 16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.card .h:after{content:"+";color:var(--gold);font-size:20px;line-height:1}
.card.open .h:after{content:"–"}
.card .b{display:none;padding:0 16px 16px;line-height:1.85;white-space:pre-wrap;font-size:15px}
.card.open .b{display:block;animation:up .25s ease}
.card .b b{color:var(--wine)}

/* ---------- admin ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.sec h3{margin:0 0 12px;font-family:var(--serif);font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row input,.row select{flex:1;min-width:130px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.btn{padding:11px 16px;border-radius:12px;border:0;background:var(--ink);color:#fbf5ee;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--wine)}
.u{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.u:last-child{border:0}
.u small{color:var(--soft)}
.note{font-size:13px;color:var(--soft);line-height:1.8}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg2)}
.tag.off{background:#f3dcdc;color:var(--wine)}
</style>

<header class="gn-mini"><a href="/" class="logo">LUVINA</a><a href="/" class="back">الموقع ←</a></header>

<section id="login">

    <h1>LUVINA</h1>

    <div class="field"><input id="lp" type="password" placeholder="الباسورد" autocomplete="current-password"></div>
    <button class="cta" id="lbtn">ادخل</button>
    <div class="err" id="lerr"></div>
    <div class="lfoot">SWISS MADE · SINCE 2001</div>
  </div>
</section>

<section id="app" class="hide">

    <div class="mono">LV</div>
    <div class="hi"><div class="t" id="greet"></div><div class="s"><span class="dot" id="net"></span><span id="netTxt"></span></div></div>
    <button class="icon-btn" id="logout">خروج</button>
  </header>
  <div class="tabs">
    <button data-tab="chat" class="on">اسأل</button>
    <button data-tab="lib">الدليل</button>
    <button data-tab="admin" id="adminTab" class="hide">الإدارة</button>
  </div>

  <main id="chat">
    <div id="home">
      <div class="tip" id="tip"></div>
      <div class="grid" id="tiles"></div>
    </div>
    <div id="msgs"></div>
  </main>
  <div class="quick" id="quick"></div>
  <form class="bar" id="ask"><input id="q" placeholder="اسألني أي حاجة… العميل قال إيه؟" autocomplete="off"><button class="send" aria-label="إرسال">↑</button></form>

  <main id="lib" class="hide"><input class="search" id="libq" placeholder="دوّر في الدليل…"><div class="cats" id="cats"></div><div id="libList"></div></main>

  <main id="admin" class="hide">
    <div class="sec"><h3>فريق السيلز</h3><div id="ulist"></div></div>
    <div class="sec">
      <h3>إضافة / تعديل مستخدم</h3>
      <div class="row"><input id="nu" placeholder="اسم المستخدم (إنجليزي)" autocapitalize="off"><input id="nn" placeholder="الاسم"></div>
      <div class="row"><input id="np" placeholder="الباسورد"><select id="nr"><option value="sales">سيلز</option><option value="admin">أدمن</option></select></div>
      <button class="btn" id="addU">حفظ المستخدم</button>
      <p class="note">التعديل بيوصل لكل الموبايلات أول ما تضغط <b>نشر</b>، وكل موبايل يتصل بالنت مرة.</p>
    </div>
    <div class="sec">
      <h3>النشر</h3>
      <div class="row"><button class="btn" id="pub">نشر التعديلات</button><button class="btn ghost" id="dl">تحميل ملف المستخدمين</button></div>
      <div class="row"><input id="tok" type="password" placeholder="مفتاح GitHub (مرة واحدة على جهازك)"><button class="btn ghost" id="saveTok">حفظ المفتاح</button></div>
      <p class="note" id="pubmsg"></p>
    </div>
    <div class="sec"><h3>أسئلة ماتجاوبتش</h3><p class="note">اللي المساعد مالقاش له رد على الجهاز ده. ابعتها لـ Claude يضيف ردها.</p><div id="miss" class="note"></div></div>
  </main>

"}, {"id": "trust", "cat": "كسب الثقة", "t": "معادلة الثقة: إزاي العميل يثق فيك", "k": ["ثقة", "يثق", "يصدقني", "مصداقية", "trust", "مش واثق", "شاكك", "مش مصدق", "علاقة"], "a": "**الثقة = (المصداقية + الالتزام + القرب) ÷ المصلحة الشخصية**\n\n• **المصداقية:** اعرف منتجك أحسن من أي حد. أي معلومة مش متأكد منها: \"هتأكد وأرجعلك\".\n• **الالتزام:** قلت هكلمك الخميس ٢؟ كلّمه الخميس ٢ بالظبط. **أصغر وعد بيبني أكبر ثقة.**\n• **القرب:** افتكر اسمه، اسم الأتيليه، آخر حاجة اتكلمتوا فيها.\n• **المصلحة الشخصية (بتقسم على كل ده!):** لو حسّ إنك عايز تبيع وخلاص، الثقة بتقع.\n\n💡 أقوى جملة ثقة: **\"لو اللون ده مش هيمشي معاك، ماتاخدوش. خد ده بداله.\"** لما تمنعه من غلطة، بيصدّقك في كل حاجة بعدها."}, {"id": "cialdini", "cat": "الأسلحة النفسية", "t": "أسلحة الإقناع الـ٦ (Cialdini)", "k": ["اقناع", "اقنع", "نفسي", "نفسية", "سلاح", "اسلحة", "تاثير", "سيالديني", "cialdini", "سيكولوجي", "psychology", "حيل", "تكتيك"], "a": "**٦ أسلحة، وإزاي تستخدمها في لوفينا:**\n\n1. **المعاملة بالمثل:** ادّي الأول. العينة اللي بتسلمها بإيدك بتخلّيه حاسس إنه مديون لك بفرصة.\n2. **الالتزام والاتساق:** خليه يقول \"أيوه\" على حاجات صغيرة: \"الكي بيفرق معاك؟\" \"أيوه.\" وبعدها الأيوه الكبيرة أسهل.\n3. **الدليل الاجتماعي:** \"أتيليهات كتير في مصر الجديدة شغالة بيه.\" الناس بتمشي ورا الناس.\n4. **السلطة:** براند سويسري من 2001، ووكيل رسمي في مصر.\n5. **الإعجاب:** الناس بتشتري من اللي بتحبه. ابتسم في صوتك، وامدح شغله بجد.\n6. **الندرة:** \"الكوردونيه No.4 فاضل منه كميات قليلة.\" ⚠️ **بس لو حقيقي.** الكدب بيحرق الثقة للأبد."}, {"id": "anchoring", "cat": "الأسلحة النفسية", "t": "المرساة (Anchoring) وعرض السعر", "k": ["مرساه", "مرساة", "anchor", "السعر الاول", "اقول السعر", "امتى اقول السعر", "عرض السعر", "تسعير", "ازاي اقول السعر"], "a": "**أول رقم بيسمعه العميل بيبقى المرجع لكل اللي بعده.**\n\n• ابدأ بالكمية الكبيرة: \"شريحة الـ٥٠ توب بتنزل التوب لـ2,200.\" وبعدها التوب الواحد بـ2,750 مايبانش غالي.\n• ابدأ بعرض **٣ متر (5,500)** لو العميل بيعمل تنورات واسعة، فالـ١٦٠ تبان اقتصادية.\n• قارن بتكلفة الغلطة: \"فستان واحد بايظ بيكلّفك أكتر من فرق التوب.\"\n\n💡 **ماتقولش السعر قبل ما تعرف احتياجه.** السعر من غير قيمة = غالي دايماً."}, {"id": "loss-aversion", "cat": "الأسلحة النفسية", "t": "الخوف من الخسارة (أقوى من حب المكسب)", "k": ["خساره", "خسارة", "يخسر", "loss", "خوف", "يخاف", "يفوت", "فرصة", "هيضيع"], "a": "**الناس بتتحرك عشان ماتخسرش أكتر ما بتتحرك عشان تكسب.**\n\n❌ \"هتكسب جودة أحسن.\"\n✅ \"كل فستان بيبوظ في الكي، إنت **بتخسر** فيه الخامة والوقت والعروسة.\"\n\n❌ \"خد ١٠ أتواب عشان الخصم.\"\n✅ \"بـ٨ أتواب إنت **سايب ٢,٧٥٠ ج** على الترابيزة.\"\n\n⚠️ استخدمها بهدوء، مش تخويف. الهدف إنه يشوف الحقيقة."}, {"id": "mirroring", "cat": "كسب الثقة", "t": "المرآة والتسمية (أسلوب كريس فوس)", "k": ["مراه", "مرآة", "mirror", "تسمية", "label", "فوس", "voss", "تفاوض", "اسمع", "استماع", "يتكلم"], "a": "**من كتاب Never Split the Difference، أقوى أسلحة التفاوض:**\n\n**١. المرآة:** كرر آخر ٢ أو ٣ كلمات قالها، بنبرة سؤال.\nالعميل: \"التل اللي معايا بيعمل مشاكل في الكي.\"\nإنت: \"**بيعمل مشاكل في الكي؟**\" ← وهو هيكمّل ويحكيلك كل حاجة.\n\n**٢. التسمية:** سمّي إحساسه.\n\"**شكلك** اتلسعت قبل كده من مورد وعدك ومانفّذش.\"\n\"**يبان إن** الوقت عندك ضيق جداً في الموسم.\"\n\n**٣. سؤال الـ\"لأ\":** \"هل يبقى غلط لو أعدّي عليك ٥ دقايق الأحد؟\" الناس بترتاح لما تقول \"لأ\" أكتر من \"أيوه\".\n\n💡 بعد ما تعمل مرآة أو تسمية، **اسكت.** الصمت سلاحك."}, {"id": "feel-felt-found", "cat": "الاعتراضات", "t": "Feel – Felt – Found: الرد على أي اعتراض", "k": ["اعتراض", "اعتراضات", "ارد على", "رد على اعتراض", "مش مقتنع", "رافض", "feel", "felt", "found"], "a": "**تركيبة بتشتغل مع أي اعتراض تقريباً:**\n\n• **Feel:** \"أنا فاهم إحساس حضرتك…\"\n• **Felt:** \"ناس كتير حسّوا نفس الإحساس في الأول…\"\n• **Found:** \"…بس اللي لقوه بعد أول توب إن…\"\n\n**مثال:**\n\"فاهم إن السعر يبان أعلى من اللي متعود عليه. أتيليهات كتير قالوا كده في الأول، بس اكتشفوا إن مفيش فساتين بتبوظ في الكي، فالتوب **بيوفر لهم**.\"\n\n💡 قبلها دايماً: **اسمع للآخر** من غير ما تقاطعه."}, {"id": "laer", "cat": "الاعتراضات", "t": "LAER: خطوات التعامل مع الاعتراض", "k": ["laer", "خطوات", "اتعامل مع", "العميل زعلان", "متضايق", "هجوم", "معترض"], "a": "**٤ خطوات بالترتيب:**\n1. **Listen (اسمع):** للآخر، من غير ما تقاطع ولا تجهّز ردك.\n2. **Acknowledge (اعترف):** \"عندك حق تسأل في ده.\" (مش موافقة، اعتراف.)\n3. **Explore (استكشف):** \"تقصد إيه بالظبط؟ قارنت بإيه؟\" غالباً الاعتراض الحقيقي حاجة تانية.\n4. **Respond (رد):** دلوقتي بس رد، على الاعتراض الحقيقي.\n\n💡 أغلب السيلز بيقفزوا لخطوة ٤ على طول، وده اللي بيخسّرهم."}, {"id": "challenger", "cat": "نظريات البيع", "t": "البيع بالتحدّي (Challenger): علّم العميل حاجة جديدة", "k": ["challenger", "تحدي", "تحدى", "اعلمه", "معلومة", "خبير", "استشاري", "ابان خبير"], "a": "**أنجح السيلز مش اللطيف بس، ده اللي بيعلّم العميل حاجة ماكانش يعرفها.**\n\n**١. علّم:** \"تعرف إن انكماش التل بعد الكي ممكن يصغّر الفستان ٢ سم؟ وده سبب إن الفستان بيطلع ضيّق على العروسة بعد التقفيل.\"\n**٢. فصّل:** اربطها بشغله: \"وده بيحصل أكتر في الطبقات الكتير اللي بتعملها.\"\n**٣. اتحكّم:** ماتخافش توجّهه: \"ماتكمّلش الموسم على تل مش مضمون، جرّب توب واحد الأسبوع ده.\"\n\n💡 إنت مش بياع قماش، إنت **مستشار خامات**."}, {"id": "rapport", "cat": "كسب الثقة", "t": "بناء الألفة (Rapport) في أول دقيقة", "k": ["الفة", "ألفة", "rapport", "اول دقيقة", "انطباع", "اول انطباع", "ارتاح", "يحبني", "قريب منه", "كيميا"], "a": "**أول ٣٠ ثانية بيحددوا كل حاجة:**\n\n• **امشي على سرعته:** لو بيتكلم بسرعة، اتكلم أسرع شوية. لو هادي، اهدى.\n• **استخدم كلماته:** لو قال \"القماشة\" ماتقولش \"الخامة\".\n• **اسمه:** قوله في الأول وفي الآخر.\n• **امدح حاجة حقيقية:** \"شفت شغل حضرتك على إنستجرام، الفستان الأوف وايت بالكم المنفوش ده تحفة.\"\n• **ابتسم وانت بتتكلم في التليفون.** الابتسامة بتتسمع.\n\n⚠️ ماتبالغش في المجاملة، بتبان مزيفة."}, {"id": "closing-tech", "cat": "نظريات البيع", "t": "تقنيات القفل", "k": ["قفل", "تقفيل", "close", "closing", "تقنيات", "اقفل ازاي", "تكنيك"], "a": "**١. القفل الافتراضي:** اتكلم كإنه وافق: \"أجهزلك الألوان دي لبكرة؟\"\n**٢. قفل الاختيار:** \"29 ولا 22؟\" ، \"١٠ ولا ٢٠ توب؟\"\n**٣. القفل الملخّص:** \"يعني محتاج تل مايتأثرش بالكي، ألوان نيود، وتوصيل سريع، وده بالظبط اللي عندنا. نبدأ؟\"\n**٤. قفل الخطوة الصغيرة:** لو متردد: \"ابدأ بكتاب الألوان، فلوسه راجعالك.\"\n**٥. القفل بالصمت:** بعد ما تقول السعر أو تسأل سؤال القفل **اسكت تماماً.** أول واحد يتكلم بيخسر.\n\n💡 لو قال لأ، مش نهاية. اسأل: \"إيه اللي ناقص عشان تبقى أيوه؟\""}, {"id": "objection-price-psych", "cat": "الأسلحة النفسية", "t": "تقسيم السعر (السعر يبان أصغر)", "k": ["تقسيم", "قسم السعر", "على الفستان", "تكلفة الفستان", "سعر المتر", "المتر بكام"], "a": "**قسّم الرقم الكبير لوحدة صغيرة:**\n\nالتوب ١٦٠ = 2,750 ج ÷ ٢٥ متر = **110 ج للمتر**.\nلو الفستان محتاج ٨ متر تل ← **880 ج تل** في فستان بيتباع بآلاف.\n\n\"الفرق بين تل لوفينا وأي تل تاني على الفستان كله **كام مية جنيه**، وده تمن إن الفستان مايبوظش.\"\n\n💡 دايماً قارن بقيمة **المنتج النهائي**، مش بسعر التل التاني."}, {"id": "listening", "cat": "كسب الثقة", "t": "فن الاستماع وقاعدة ٧٠/٣٠", "k": ["استماع", "اسمع", "بتكلم كتير", "ساكت", "٧٠", "70", "سكوت", "صمت"], "a": "**العميل يتكلم ٧٠٪، وإنت ٣٠٪.**\n\n• اسأل أسئلة **مفتوحة**: \"إزاي؟ إيه؟ احكيلي…\" مش أسئلة إجابتها أيوه أو لأ.\n• **دوّن** كلماته بالظبط واستخدمها بعدين.\n• **ماتقاطعش** حتى لو عارف هيقول إيه.\n• لخّص كلامه: \"يعني لو فهمتك صح…\" ده بيحسّسه إنك فاهمه.\n\n💡 أكتر حاجة بتفرّق السيلز المحترف: **بيسأل أكتر ما بيتكلم.**"}, {"id": "gatekeeper", "cat": "سكريبتات", "t": "التعامل مع السكرتيرة / المساعدة", "k": ["سكرتيره", "سكرتيرة", "مساعده", "المساعدة", "مش موجود", "مش موجودة", "اوصل للمصمم", "مش بيردوا", "حد تاني بيرد"], "a": "**المساعدة مش عدو، دي بوابتك.**\n\n• اتكلم معاها **بثقة وندّية**، مش توسّل: \"أهلاً، أنا [اسمك] من لوفينا. عندي حاجة لـ[اسم المصممة] بخصوص خامة التل، ٢ دقيقة.\"\n• اعرف **اسمها** واستخدمه في كل مكالمة.\n• **خليها حليفتك:** \"إنتي أكيد عارفة أكتر مشكلة بتقابلكم في التل.\"\n• لو قالت \"مش موجودة\": \"تمام، إمتى أنسب وقت أكلمها؟ ولا أعدّي أسيب العينة معاكي؟\"\n\n⚠️ ممنوع: \"معلش ممكن لو سمحتي لو ينفع…\" ده توسّل."}, {"id": "motivation", "cat": "العقلية", "t": "العقلية: لما تتعب أو تترفض", "k": ["تعبان", "محبط", "زهقت", "زهقان", "مش عارف ابيع", "رفض", "رفضوني", "مفيش بيع", "احباط", "يأس", "موود", "قافل", "ضغط"], "a": "**الرفض جزء من الشغل، مش حكم عليك.**\n\n• في المتوسط بتحتاج **٨–١٠ مكالمات** عشان بيعة واحدة. كل \"لأ\" قرّبتك من \"أيوه\".\n• ماتحسبش البيعات بس، احسب **الأفعال**: مكالمات، عينات، مواعيد. الأفعال بتجيب البيع.\n• بعد كل رفض اسأل نفسك: **\"اتعلمت إيه؟\"** مش \"ليه أنا؟\".\n• ابدأ يومك بأسهل مكالمة، الزخم بيكبر.\n\n💪 لوفينا منتج قوي بجد. إنت مش بتقنع حد بحاجة وحشة، إنت بتحل مشكلة حقيقية."}, {"id": "objection-busy", "cat": "الاعتراضات", "t": "العميل بيقول: مشغول / مش فاضي", "k": ["مشغول", "مش فاضي", "مش فاضيه", "وقت", "مستعجل", "بعدين كلمني", "كلمني بعدين"], "a": "• **احترم وقته فوراً:** \"تمام جداً، هاخد ٣٠ ثانية بس.\"\n• قول **أقوى جملة** عندك: \"تل سويسري مايتأثرش بالكي وعليه ضمان. أسيبلك عينة تجربها بنفسك؟\"\n• أو حدد ميعاد: \"أكلمك بكرة ١١ ولا ٢؟\"\n\n💡 \"مشغول\" غالباً معناها \"مش شايف قيمة لسه\". اديله القيمة في جملة واحدة."}, {"id": "weekly-routine", "cat": "العقلية", "t": "روتين السيلز المحترف", "k": ["روتين", "يومي", "خطة", "تنظيم", "يومي ايه", "ابدأ يومي", "جدول", "تارجت", "target", "هدف"], "a": "**يوم السيلز المحترف:**\n• **الصبح:** راجع الـleads ورتّب أولويات اليوم (المتابعات الأول).\n• **أحسن وقت للمكالمات:** ١١–١ و ٤–٦.\n• **قاعدة الـ٥:** ٥ مكالمات جديدة + ٥ متابعات كل يوم، على الأقل.\n• **بعد كل مكالمة:** سجّل حالاً: اسم، نوع، منطقة، اتقال إيه، الخطوة الجاية وميعادها.\n• **آخر اليوم:** حدد أول ٣ مكالمات بكرة.\n\n💡 **مفيش عميل من غير \"خطوة جاية\" بميعاد.**"}]};window.U0={"version": 2, "users": [{"u": "mahmoud", "name": "محمود", "role": "admin", "active": true, "salt": "38162ee6e5373ac8", "hash": "618cec15a88b89933af16b8b1556e6c335f99301a4ea52a4ccf490b49754f0cd"}]};</script>
<script>

async function getJSON(u){const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return r.json()}

  if(location.protocol==="file:")return;

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

  const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value.trim();$("#lerr").textContent="";
  if(!USERS){$("#lerr").textContent="افتح الأبلكيشن مرة وانت متصل بالنت الأول.";return}

/* ---------- arabic ---------- */
const AD="٠١٢٣٤٥٦٧٨٩";
function norm(s){return (s||"").toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[^\p{L}\p{N}%\s]/gu," ").replace(/\s+/g," ").trim()}
const STOP=new Set("انا انت انتي هو هي احنا ده دي دا اللي الي في من على علي عن مع و او يا ايه اي ازاي كده بس لو لما عشان علشان هل ما مش لا ال اقول اعمل اعمله عايز عاوز محتاج ممكن طيب طب بقى انه انها له ليه لها كان يكون عنده عندي حاجه".split(" "));
function toks(s){return norm(s).split(" ").filter(w=>w&&!STOP.has(w)).map(w=>w.length>4&&w.startsWith("ال")?w.slice(2):w)}

/* ---------- engine ---------- */
function prepKB(){if(!KB||!KB.entries)KB=window.KB0;if(KB._p)return;KB.entries.forEach(e=>{e._k=e.k.map(norm);e._t=toks(e.t);e._a=norm(e.a)});KB._p=1}
function score(e,qt,qn){let s=0;
  for(const k of e._k){if(k.includes(" ")){if(qn.includes(k))s+=6;continue}
    for(const w of qt){if(w===k)s+=5;else if(w.length>=3&&k.length>=3&&(w.includes(k)||k.includes(w)))s+=3}}
  for(const w of qt){if(e._t.includes(w))s+=2;else if(w.length>=4&&e._a.includes(w))s+=.5}
  return s}
function search(q){prepKB();const qt=toks(q),qn=" "+norm(q)+" ";if(!qt.length)return[];
  return KB.entries.map(e=>({e,s:score(e,qt,qn)})).filter(x=>x.s>=4).sort((a,b)=>b.s-a.s)}
const fmt=n=>n.toLocaleString("en-US");
function calc(q){const n=norm(q);
  const m=n.match(/(\d+)\s*(توب|اتواب|تواب|رول|رولات|كوب|كوبات|roll)/)||n.match(/(?:عايز|طالب|هياخد|ياخد|اخد|جاب|جايب|يجيب)\s*(\d+)/);
  if(!m)return null;const qty=+m[1];if(!qty||qty>100000)return null;
  if(/كوب|فرنش|ليس|دانتيل|كوردونيه/.test(n)){const t=qty*PRICES.lace;return `<span class="ttl">حساب الدانتيل الفرنسي</span><table class="calc"><tr><td>${qty} كوب × ${fmt(PRICES.lace)}</td><td>${fmt(t)} ج</td></tr><tr class="tot"><td>الإجمالي</td><td>${fmt(t)} ج</td></tr></table>⚠️ الفرنش ليس مش داخل في خصم الشركاء.`}
  const wide=/(\b3\s*م|\b3 متر|تلاته متر|تلات متر|عرض 3|300)/.test(n),price=wide?PRICES.w3:PRICES.w160,lbl=wide?"عرض ٣ متر":"عرض ١٦٠ سم";
  const tier=TIERS.find(t=>qty>=t[0]),pct=tier?tier[1]:0,gross=qty*price,disc=Math.round(gross*pct/100),net=gross-disc;
  let tip="";const next=[...TIERS].reverse().find(t=>t[0]>qty);
  if(next){const ng=next[0]*price,nn=ng-Math.round(ng*next[1]/100);tip=`\n💡 لو خلّاهم <b>${next[0]}</b> توب ياخد <b>${next[1]}%</b>: الإجمالي ${fmt(nn)} ج (التوب بـ${fmt(Math.round(nn/next[0]))}).`}
  return `<span class="ttl">حساب الطلب · ${lbl}</span><table class="calc"><tr><td>${qty} توب × ${fmt(price)}</td><td>${fmt(gross)} ج</td></tr><tr><td>خصم الشركاء ${pct}%</td><td>− ${fmt(disc)} ج</td></tr><tr class="tot"><td>الإجمالي</td><td>${fmt(net)} ج</td></tr></table>التوب عليه <b>${fmt(Math.round(net/qty))} ج</b>. الشحن على العميل.${wide?"":"\n(لو قصدك عرض ٣ متر اكتب \"٣ متر\")"}${tip}`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}

/* ---------- personality ---------- */
const first=()=>(ME&&ME.name||"").split(" ")[0];
const SMALL=[
  {re:/^(اهلا|اهلين|هاي|هاى|هلو|السلام|سلام|صباح|مساء|ازيك|ازيك يا|عامل ايه|hi|hello)/,r:()=>pick([`أهلاً يا ${first()} 👋 جاهز معاك. العميل قال إيه النهارده؟`,`يا هلا يا ${first()}! إيه الموقف اللي معاك؟`,`صباح الفل يا ${first()} ☀️ اسألني في أي حاجة.`])},
  {re:/(شكرا|شكر|تسلم|متشكر|ميرسي|thanks|تمام كده|حلو اوي|جامد)/,r:()=>pick([`العفو يا ${first()} 🙏 روح اقفلها!`,"تحت أمرك دايماً. بالتوفيق في المكالمة 💪","ولا يهمك. لو العميل قال حاجة تانية، ارجعلي."])},
  {re:/(انت مين|مين انت|بتعمل ايه|تقدر تعمل ايه|ازاي استخدمك|بتعرف ايه)/,r:()=>`أنا مساعد لوفينا 🤍 شغال حتى من غير نت.\nاسألني عن:\n• **رد على عميل** (غالي، هفكر، عندي مورد…)\n• **سكريبت** لأتيليه أو تاجر أو مصنع\n• **أسلحة الإقناع** وكسب الثقة\n• **أسعار وألوان** ولو كتبت "٢٥ توب" أحسبلك الفاتورة`},
];
const LEADS=["بص يا {n} 👌","تمام، ركّز معايا:","حلو السؤال ده.","دي بسيطة، بص:","خد دي وانت مرتاح:","موقف بيتكرر كتير، وده الحل:"];
const lead=()=>`<span class="lead">${esc(pick(LEADS).replace("{n}",first()))}</span>`;

/* ---------- chat ---------- */
const msgs=$("#msgs"),chatEl=$("#chat");
function bubble(html,who){const d=document.createElement("div");d.className="msg "+who;d.innerHTML=`<div class="av">LV</div><div class="bub">${html}</div>`;msgs.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d}
function bot(html){$("#home").classList.add("hide");const t=bubble("<i></i><i></i><i></i>","bot typing");
  setTimeout(()=>{t.remove();bubble(html,"bot")},350+Math.random()*350)}
function rel(list,label){return list.length?`<div class="rel"><div class="lbl">${label||"ممكن كمان يفيدك:"}</div><div class="chips">${list.map(o=>`<button class="chip" data-id="${o.id}">${esc(o.t)}</button>`).join("")}</div></div>`:""}
function entryHTML(e,others,withLead){return (withLead?lead():"")+`<span class="ttl">${esc(e.t)}</span>${md(e.a)}`+rel(others||[])}
function related(e,except){prepKB();return KB.entries.filter(x=>x.cat===e.cat&&x.id!==e.id&&!(except||[]).includes(x.id)).slice(0,3)}
function answer(q){
  $("#home").classList.add("hide");bubble(esc(q),"me");
  const n=norm(q);
  for(const s of SMALL)if(s.re.test(n)&&n.split(" ").length<=5){bot(md(s.r()));return}
  const c=calc(q),r=search(q);
  if(c){bot(c+rel(KB.entries.filter(x=>["tiers","upsell-10","closing"].includes(x.id)),"وكمان:"));return}
  if(!r.length){const m=LS.get("lv_miss",[]);m.unshift({q,d:new Date().toISOString().slice(0,10),u:ME&&ME.name});LS.set("lv_miss",m.slice(0,100));
    bot(`مش لاقي إجابة أكيدة على ده يا ${esc(first())} 🤔\n<b>ماتألّفش رد للعميل.</b> قوله "هتأكد وأرجعلك"، واسأل المدير.\n\nأو جرّب تكتبها بكلمة تانية:<div class="chips" style="margin-top:8px">${["العميل بيقول غالي","إزاي أكسب ثقته","أسلحة الإقناع","حجز ميعاد مع أتيليه"].map(t=>`<button class="chip" data-q="${t}">${t}</button>`).join("")}</div>`);return}
  const top=r[0].e,more=r.slice(1,4).filter(x=>x.s>=5).map(x=>x.e);
  bot(entryHTML(top,more.length?more:related(top),true));
}
msgs.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.id){const en=KB.entries.find(x=>x.id===b.dataset.id);$("#home").classList.add("hide");bubble(esc(en.t),"me");bot(entryHTML(en,related(en),false))}
  else if(b.dataset.q)answer(b.dataset.q)});
function send(){const q=$("#q").value.trim();if(!q)return;$("#q").value="";try{answer(q)}catch(err){bubble("حصلت مشكلة: "+esc(err&&err.message||err),"bot")}}
$("#ask").addEventListener("submit",e=>{e.preventDefault();send()});

const QUICK=["العميل بيقول غالي","هفكر وأرد عليك","أسلحة الإقناع","إزاي أكسب ثقته","حجز ميعاد مع أتيليه","٢٥ توب ١٦٠","تقنيات القفل","الألوان"];
$("#quick").innerHTML=QUICK.map(t=>`<button class="chip">${t}</button>`).join("");
$("#quick").onclick=e=>{const b=e.target.closest(".chip");if(b){tab("chat");answer(b.textContent)}};

const TILES=[
  ["🤝","كسب الثقة","إزاي يصدّقك من أول مرة","إزاي أكسب ثقة العميل"],
  ["🧠","الأسلحة النفسية","٦ أسلحة إقناع","أسلحة الإقناع"],
  ["🛡️","الاعتراضات","غالي، هفكر، عندي مورد","العميل بيقول غالي"],
  ["📈","نظريات البيع","SPIN · Challenger · القفل","طريقة SPIN"],
  ["🎬","سكريبتات جاهزة","مكالمة، واتساب، متابعة","أول مكالمة مع عميل جديد"],
  ["🧮","حاسبة الخصم","اكتب الكمية وأنا أحسب","٢٠ توب ١٦٠"],
];
$("#tiles").innerHTML=TILES.map((t,i)=>`<button class="tile" style="animation-delay:${i*50}ms" data-q="${t[3]}"><div class="e">${t[0]}</div><div class="n">${t[1]}</div><div class="d">${t[2]}</div></button>`).join("");
$("#tiles").onclick=e=>{const b=e.target.closest(".tile");if(b)answer(b.dataset.q)};

function tipOfDay(){prepKB();const pool=KB.entries.filter(e=>["كسب الثقة","الأسلحة النفسية","نظريات البيع","العقلية"].includes(e.cat));
  const day=Math.floor(Date.now()/864e5),e=pool[day%pool.length];
  const plain=e.a.replace(/\*\*/g,"").split("\n").filter(l=>l.trim())[0];
  $("#tip").innerHTML=`<div class="k">سلاح النهارده</div><div class="h">${esc(e.t)}</div><div class="b">${esc(plain)}</div><button data-id="${e.id}">اقرا الشرح كامل ←</button>`;
  $("#tip button").onclick=()=>{bubble(esc(e.t),"me");bot(entryHTML(e,related(e),false))}}

/* ---------- library ---------- */
let curCat="";
function lib(){prepKB();const f=$("#libq").value.trim();let list=f?search(f).map(x=>x.e):KB.entries;if(curCat&&!f)list=list.filter(e=>e.cat===curCat);
  const by={};list.forEach(e=>(by[e.cat]=by[e.cat]||[]).push(e));
  $("#libList").innerHTML=Object.keys(by).map(c=>`<div class="cat">${esc(c)}</div>`+by[c].map(e=>`<div class="card${f?" open":""}"><div class="h">${esc(e.t)}</div><div class="b">${md(e.a)}</div></div>`).join("")).join("")||'<p class="note">مفيش نتايج.</p>'}
function cats(){prepKB();const cs=[...new Set(KB.entries.map(e=>e.cat))];$("#cats").innerHTML=[`<button class="chip${curCat?"":" on"}" data-c="">الكل</button>`,...cs.map(c=>`<button class="chip${c===curCat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`)].join("")}
$("#cats").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;curCat=b.dataset.c;cats();lib()};
$("#libList").onclick=e=>{const h=e.target.closest(".h");if(h)h.parentElement.classList.toggle("open")};
$("#libq").oninput=lib;

/* ---------- tabs ---------- */
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  ["chat","lib","admin"].forEach(id=>$("#"+id).classList.toggle("hide",id!==t));
  $("#quick").classList.toggle("hide",t!=="chat");$("#ask").classList.toggle("hide",t!=="chat");
  if(t==="lib"){cats();lib()}if(t==="admin")admin()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));

/* ---------- admin ---------- */
function admin(){
  $("#ulist").innerHTML=USERS.users.map(u=>`<div class="u"><div><b>${esc(u.name)}</b> <small>${esc(u.u)}</small> <span class="tag">${u.role==="admin"?"أدمن":"سيلز"}</span> ${u.active?"":'<span class="tag off">موقوف</span>'}</div><div class="row" style="margin:0">${u.u===ME.u?"":`<button class="btn ghost" data-t="${u.u}">${u.active?"إيقاف":"تفعيل"}</button><button class="btn danger" data-d="${u.u}">حذف</button>`}</div></div>`).join("");
  const m=LS.get("lv_miss",[]);$("#miss").innerHTML=m.length?m.map(x=>`• ${esc(x.q)} <small>(${esc(x.u||"")} ${x.d})</small>`).join("<br>"):"مفيش لسه 👌";
  $("#tok").value=LS.get("lv_tok","")?"••••••••":""}
function dirty(){USERS.version=(USERS.version||1)+1;USERS.local=1;LS.set("lv_users",USERS);admin();$("#pubmsg").textContent="فيه تعديلات لسه ما اتنشرتش. اضغط نشر."}
$("#ulist").onclick=e=>{const t=e.target.dataset.t,d=e.target.dataset.d;
  if(t){const u=USERS.users.find(x=>x.u===t);u.active=!u.active;dirty()}
  if(d&&confirm("تحذف المستخدم "+d+"؟")){USERS.users=USERS.users.filter(x=>x.u!==d);dirty()}};
$("#addU").onclick=async()=>{const u=$("#nu").value.trim().toLowerCase(),n=$("#nn").value.trim()||u,p=$("#np").value.trim(),r=$("#nr").value;
  if(!/^[a-z0-9._-]{3,}$/.test(u)){alert("اسم المستخدم إنجليزي وأرقام، ٣ حروف على الأقل");return}
  if(p.length<4){alert("الباسورد ٤ حروف على الأقل");return}
  const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join(""),hash=await sha(salt+":"+p);
  const ex=USERS.users.find(x=>x.u===u);if(ex)Object.assign(ex,{name:n,role:r,salt,hash,active:true});else USERS.users.push({u,name:n,role:r,active:true,salt,hash});
  $("#nu").value=$("#nn").value=$("#np").value="";dirty()};
function clean(){const c=JSON.parse(JSON.stringify(USERS));delete c.local;return c}
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(clean(),null,1)],{type:"application/json"}));a.download="users.json";a.click()};
$("#saveTok").onclick=()=>{const v=$("#tok").value.trim();if(v&&!v.startsWith("•")){LS.set("lv_tok",v);$("#pubmsg").textContent="المفتاح اتحفظ على الجهاز ده بس."}};
$("#pub").onclick=async()=>{const tok=LS.get("lv_tok","");if(!tok){$("#pubmsg").textContent="محتاج مفتاح GitHub الأول، أو حمّل الملف وابعته لـ Claude.";return}
  if(!navigator.onLine){$("#pubmsg").textContent="النشر محتاج نت.";return}
  $("#pubmsg").textContent="بينشر…";
  const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}`,h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  try{const cur=await fetch(api+"?ref="+REPO.branch,{headers:h,cache:"no-store"});const s=cur.ok?(await cur.json()).sha:undefined;
    const body=btoa(unescape(encodeURIComponent(JSON.stringify(clean(),null,1))));
    const r=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"Update team users",content:body,sha:s,branch:REPO.branch})});
    if(!r.ok)throw 0;delete USERS.local;LS.set("lv_users",USERS);$("#pubmsg").textContent="✓ اتنشر، هيوصل لكل الموبايلات خلال دقيقتين."}
  catch(e){$("#pubmsg").textContent="النشر فشل، اتأكد من المفتاح."}};

/* ---------- start ---------- */
function greet(){const h=new Date().getHours();return (h<12?"صباح الفل":h<17?"يومك جميل":"مساء الورد")+" يا "+first()}
function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");
  $("#greet").textContent=greet();$("#adminTab").classList.toggle("hide",ME.role!=="admin");netDot();tipOfDay()}
(async()=>{if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(ME&&USERS&&USERS.users.find(x=>x.u===ME.u&&x.active&&x.hash===ME.hash))start();
  await sync()})();
</script>
<script src="site.js"></script>
</body>
</html>
