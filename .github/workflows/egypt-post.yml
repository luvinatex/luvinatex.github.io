name: Egypt Post prices
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/egypt-post.mjs
      - name: Commit prices
        run: |
          git config user.name "Luvina Bot"
          git config user.email "luvinatex@users.noreply.github.com"
          git add shipping/egypt-post.json
          git diff --cached --quiet || (git commit -m "Update Egypt Post air parcel prices" && git push)
